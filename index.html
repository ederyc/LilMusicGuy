<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>Lil Music Guy</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="stage"></div>

    <aside id="panel">
      <h1>Lil Music Guy <span class="tag">test bench</span></h1>

      <section>
        <h2>Music source</h2>
        <div class="sources">
          <button data-source="simulated" title="Fake spectrum data, no sound">Simulated</button>
          <button data-source="synth" title="Generated beat played through real audio analysis">Test track</button>
          <button data-source="file" title="Play a local audio file">Audio file…</button>
          <button data-source="system" title="Share a tab or your screen with audio">Computer audio</button>
          <button data-source="mic" title="Listen through the microphone or another input device">Mic / input</button>
          <button data-source="off">Stop</button>
        </div>
        <input type="file" id="file-input" accept="audio/*" hidden />
        <p class="hint" id="source-hint">Pick a source to get him moving.</p>

        <label class="row" id="style-row">
          <span>Style</span>
          <select id="sim-style"></select>
        </label>
        <label class="row" id="device-row">
          <span>Input</span>
          <select id="input-device"></select>
        </label>
        <label class="row" id="bpm-row">
          <span>Tempo</span>
          <input type="range" id="bpm" min="70" max="180" value="120" />
          <output id="bpm-out">120</output>
        </label>
        <label class="row" id="level-row">
          <span>Loudness</span>
          <input type="range" id="level" min="0" max="100" value="80" />
          <output id="level-out">80</output>
        </label>
        <label class="row" id="volume-row">
          <span>Volume</span>
          <input type="range" id="volume" min="0" max="100" value="60" />
          <output id="volume-out">60</output>
        </label>
      </section>

      <section>
        <h2>What he hears</h2>
        <div class="readout">
          <div class="beat-dot" id="beat-dot"></div>
          <div><strong id="bpm-detected">–</strong> BPM</div>
          <div class="move" id="move">Idle</div>
        </div>
        <label class="row" id="dance-row" title="Auto picks moves to suit the music. Pick one to watch it on its own (works with no music, at the Tempo below).">
          <span>Dance</span>
          <select id="dance"></select>
        </label>
        <div class="meter"><span>Bass</span><div><i id="m-bass"></i></div></div>
        <div class="meter"><span>Mid</span><div><i id="m-mid"></i></div></div>
        <div class="meter"><span>Treble</span><div><i id="m-treble"></i></div></div>
        <div class="meter"><span>Groove</span><div><i id="m-intensity"></i></div></div>
      </section>

      <section>
        <h2>Vibe</h2>
        <div class="vibe">
          <strong id="vibe">–</strong>
          <span id="vibe-sub"></span>
        </div>
        <div class="meter"><span>Energy</span><div><i id="t-energy"></i></div></div>
        <div class="meter"><span>Punch</span><div><i id="t-punch"></i></div></div>
        <div class="meter"><span>Bass</span><div><i id="t-bass"></i></div></div>
        <div class="meter"><span>Bright</span><div><i id="t-bright"></i></div></div>
        <div class="meter"><span>Noisy</span><div><i id="t-noisy"></i></div></div>
        <div class="meter"><span>Swing</span><div><i id="t-swing"></i></div></div>
      </section>

      <section>
        <h2>Customize</h2>
        <div class="colors">
          <label>Skin <input type="color" data-color="skin" /></label>
          <label>Shirt <input type="color" data-color="shirt" /></label>
          <label>Pants <input type="color" data-color="pants" /></label>
          <label>Shoes <input type="color" data-color="shoes" /></label>
        </div>
        <div class="accessories" id="accessories"></div>
        <label class="row" id="prop-row">
          <span>Home</span>
          <select id="prop"></select>
        </label>
      </section>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
